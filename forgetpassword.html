<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: cyan;
            background-image: url('download.jpeg');
            background-size: cover;
            background-image: url('file:///Users/devanshverma/Desktop/DEVANSH/download.jpeg');
        }

        .forgot-box {
            width: 300px;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: blue;
        }

        .back {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="forgot-box">

        <h2>FORGOT PASSWORD</h2>

        <form>
            <label for="email">Enter Email</label>

            <input 
                id="email" 
                type="email" 
                placeholder="Enter your email/Username"
                required
            >

            <button type="submit">
                RESET PASSWORD
            </button>
        </form>

        <div class="back">
            <a href="loginpage.html">Back to Login</a>
        </div>

    </div>

</body>
</html>
